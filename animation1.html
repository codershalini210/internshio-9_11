<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box
        {
            height:100px;
            width:100px;
            border:1px solid black;
            animation-name: moving;
            animation-duration: 4s;
            animation-iteration-count: infinite;
            animation-timing-function: linear;
        }
        @keyframes moving{
            0%{margin-left:0px;background-color: yellow;margin-top:0px;}
            25%{margin-top:200px;}
            50%{margin-left:500px;background-color:green;margin-top:0px;}
            75%{margin-top:200px;}
            100%{margin-left:0px;background-color: yellow; margin-top:0px;}
            /* from{margin-left:1px ;}
            to{margin-left:500px;} */
        }
    </style>
</head>
<body>
    <div class="box">

    </div>
    
</body>
</html>
