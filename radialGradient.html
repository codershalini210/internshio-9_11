<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container
        {
            display: flex;
            flex-wrap: wrap;
            gap:10px;

        }
        .container>div{
            height:200px;
            width:200px;
            border:1px solid black;
        }
        .box
        {
        background: radial-gradient(ellipse,blue,yellow);
        }
    </style>
</head>
<body>
    <div class="container">
    <div class="box"></div>
    <div style="background: 
    radial-gradient(circle closest-corner at 40px 50px ,blue,yellow,transparent 50%),
    radial-gradient(circle closest-corner at 140px 140px, purple,orange,transparent 50%)"></div>
    </div>
</body>
</html>
